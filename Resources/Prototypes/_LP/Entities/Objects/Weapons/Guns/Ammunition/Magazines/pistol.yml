- type: entity
  id: LPPBaseMagazinePistolPF20
  name: "Pistol magazine (.20)"
  parent: [BaseItem, BaseSecurityContraband]
  abstract: true
  components:
  - type: Tag
    tags:
      - LPPMagazinePistolRifle
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeRifle
    capacity: 15
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _LP/Objects/Weapons/Guns/Ammunition/Magazine/PF20mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: false
  - type: Appearance

- type: entity
  id: LPPMagazinePistolPF20SP
  name: Pistol magazine (.20 SP)
  parent: LPPBaseMagazinePistolPF20
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeRifleSP
  - type: Sprite
    layers:
    - state: red
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

