- type: entity
  parent: [ ClothingHeadBase ]
  id: ClothingHeadHatWhiteCatEars
  name: white cat ears
  description: "NYAH!"
  components:
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag
  - type: Sprite
    sprite: Clothing/Head/Hats/catears.rsi
  - type: Clothing
    sprite: Clothing/Head/Hats/catears.rsi
  - type: AddAccentClothing
    accent: OwOAccent
  - type: StaticPrice
    price: 15

- type: entity
  parent: [ClothingHeadHatWhiteCatEars, BaseToggleClothing]
  id: ClothingHeadHatWhiteCatEarsValid
  suffix: Valid, DO NOT MAP
  categories: [ DoNotMap ]
  components:
  - type: ToggleClothing
    action: ActionBecomeValid
    disableOnUnequip: true
  - type: ComponentToggler
    parent: true
    components:
    - type: KillSign
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag
  - type: Sprite
    sprite: Clothing/Head/Hats/catears.rsi
  - type: Clothing
    sprite: Clothing/Head/Hats/catears.rsi
  - type: AddAccentClothing
    accent: OwOAccent

# From Funky
- type: entity
  parent: ClothingHeadBase # LP edit - не наследуем стак обычного конуса, иначе тайник сливается в стопку
  id: ClothingSyndiHeadHatCone
  name: warning cone # LP edit
  description: This cone is trying to warn you of something! # LP edit
  suffix: Storage, Syndicate
  components:
  # LP edit start
  - type: Sprite
    sprite: _Funkystation/Clothing/Head/Misc/cone.rsi
  - type: Clothing
    sprite: _Funkystation/Clothing/Head/Misc/cone.rsi
  - type: Item
    storedRotation: 0
  - type: PhysicalComposition
    materialComposition:
      Plastic: 100
  - type: StaticPrice
    price: 25
  # LP edit end
  - type: Storage
    grid:
    - 0,0,0,1
    maxItemSize: Small
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
      hidden_slot: !type:ContainerSlot
