- type: entity
  id: BulletSpecialSP
  name: bullet (.38 special SP)
  parent: BulletTrace
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    armorPenetration: 0.25
    damage:
      types:
        Piercing: 30
  - type: HitscanPierce
    chance: 0.69
    deviation: 0.05
    pierceLevel: Metal
  - type: HitscanRicochet
    chance: 0.80
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle
    travelFlash:
      sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: trace
    impactFlash:
      sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact
    bullet:
      sprite:
        sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
        state: sp

