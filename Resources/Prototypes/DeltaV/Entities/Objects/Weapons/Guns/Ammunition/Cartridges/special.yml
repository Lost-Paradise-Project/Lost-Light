- type: entity
  id: BaseCartridgeSpecial
  name: cartridge (.38 special)
  parent: BaseCartridge
  abstract: true
  components:
  - type: Tag
    tags:
      - Cartridge
      - CartridgeSpecial
  - type: CartridgeAmmo
    proto: BulletSpecialSP
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 10

- type: entity
  id: CartridgeSpecialSP
  name: cartridge (.38 special SP)
  parent: BaseCartridgeSpecial
  components:
  - type: CartridgeAmmo
    proto: BulletSpecialSP

- type: entity
  id: CartridgeSpecialHP
  name: cartridge (.38 special HP)
  parent: BaseCartridgeSpecial
  components:
