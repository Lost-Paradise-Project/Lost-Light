- type: entity
  id: PartTajaran
  parent: [BaseItem, BasePart]
  name: "Tajaran body part"
  abstract: true
  components:
    - type: Extractable
      juiceSolution:
        reagents:
          - ReagentId: Fat
            Quantity: 3
          - ReagentId: Blood
            Quantity: 10

- type: entity
  id: TorsoTajaran
  name: "Tajaran torso"
  parent: [PartTajaran, BaseTorso]
  components:
    - type: Sprite
      sprite: Corvax/Mobs/Species/Tajaran/parts.rsi
      state: "torso"
    - type: Icon
      sprite: Corvax/Mobs/Species/Tajaran/parts.rsi
      state: "torso"
    - type: BodyPart
      partType: Torso
    - type: Extractable
      juiceSolution:
        reagents:
          - ReagentId: Fat
            Quantity: 10
          - ReagentId: Blood
            Quantity: 20

- type: entity
  id: HeadTajaran
  name: "Tajaran head"
  parent: [PartTajaran, BaseHead]
  components:
    - type: Sprite
      sprite: Corvax/Mobs/Species/Tajaran/parts.rsi
      state: "head"
    - type: Icon
      sprite: Corvax/Mobs/Species/Tajaran/parts.rsi
      state: "head"
    - type: BodyPart
      partType: Head
      vital: true
    - type: Input
      context: "ghost"
    - type: Tag
      tags:
        - Head
    - type: Extractable
      juiceSolution:
        reagents:
          - ReagentId: Fat
            Quantity: 3
          - ReagentId: Blood
            Quantity: 10

